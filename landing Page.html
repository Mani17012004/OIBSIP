<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      color: #333;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 80vh;
      text-align: center;
      background: linear-gradient(to right, #6366f1, #818cf8);
      color: white;
      padding: 0 20px;
    }

    .hero h2 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
      max-width: 600px;
    }

    .hero button {
      background: white;
      color: #4f46e5;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .hero button:hover {
      background: #e0e7ff;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #e5e7eb;
      font-size: 14px;
      color: #555;
    }

    @media (max-width: 600px) {
      .hero h2 {
        font-size: 32px;
      }
      .hero p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>MyBrand</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to Our Landing Page</h2>
    <p>We offer awesome solutions to boost your business. Simple, elegant, and powerful tools to grow your online presence.</p>
    <button onclick="alert('You clicked Get Started!')">Get Started</button>
  </section>

  <footer>
    © 2025 MyBrand. All rights reserved.
  </footer>

</body>
</html>
